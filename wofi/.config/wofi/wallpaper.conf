# wofi config for the wallpaper picker (SUPER+W). Kept separate from the app
# launcher config so mod+d is unaffected.
width=55%
height=70%
prompt=Wallpaper
normal_window=true
location=center
gtk-dark=true
allow_images=true
image_size=128
insensitive=true
allow_markup=false
no_actions=true
orientation=vertical
halign=fill
content_halign=fill
# Navigation: arrows + Vim j/k. Binding j/k here means they move the selection
# instead of being typed into the search box. Mouse-wheel scrolling and Enter
# (key_submit) work by default.
key_up=Up,k
key_down=Down,j
key_submit=Return
key_exit=Escape
