################
### MONITORS ###
################




# See https://wiki.hypr.land/Configuring/Monitors/
# Rotate
# monitor= eDP-1,1920x1080@60,0x0,1,transform,2

# Laptop internal panel — 60Hz (only matches on the laptop, ignored elsewhere)
monitor = eDP-1, 1920x1080@60, 0x0, 1, transform, 0

# Any other monitor (e.g. the desktop's high-refresh display): use the HIGHEST
# refresh rate it supports -> 200Hz on the PC, for a smooth picture.
# A monitor with no rule of its own falls through to this catch-all line.
monitor = , highrr, auto, 1

###################
### MY PROGRAMS ###
###################


# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = brave
$code = code
$cursor = hyprctl setcursor Bibab-Modern-Classic 24

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar & hyprpaper & $cursor & swaync

# layerrule = blur 1, waybar

# exec-once = mpvpaper eDP-1 /home/qantr/Downloads/miyamoto.mp4 --loop --no-audio

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = HYPRCURSOR_THEME, Bibab-Modern-Classic
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Added for sharp fractional scaling
env = GDK_DPI_SCALE,1.2          # GTK apps like GNOME apps, Thunar, etc.
env = QT_SCALE_FACTOR,1.2        # Qt apps like V
# windowrule = scale 1.5, class:^(discord)$LC, KDE apps
env = HYPRLAND_DPI,120           # Wayland UI scaling

# windowrulev2 = size 1.5, class:^(discord)$



